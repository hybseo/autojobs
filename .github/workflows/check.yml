name: 사이트 점검

# 언제 돌리나
#   1) 버튼으로 직접 (Actions → 사이트 점검 → Run workflow)
#   2) 매일 KST 09:17 에 한 번
#
# 왜 아침에 도는가
#   새벽 갱신이 끝난 뒤입니다. 밤사이 뭔가 어긋났으면 업무 시작할 때
#   알 수 있습니다. 갱신 자체에도 검사가 붙어 있지만, 그것은 커밋 전
#   데이터만 봅니다. 이 점검은 배포까지 끝난 실제 화면을 열어 봅니다.
#
#   빌드가 성공해도 화면이 안 만들어질 수 있습니다. 2026-09-11 에
#   제약바이오를 등록했는데 산업 페이지가 생기지 않은 적이 있습니다.
#   공고는 들어왔고 빌드도 통과했는데 페이지만 없었습니다.

on:
  workflow_dispatch:
  schedule:
    # UTC 00:17 = KST 09:17
    - cron: '17 0 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --pages 를 붙여 배포된 사이트를 실제로 열어 봅니다.
      # 데이터만 보는 검사는 갱신 워크플로가 이미 합니다.
      - name: 자가진단
        run: python scripts/check.py --pages
