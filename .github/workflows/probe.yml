name: ATS 탐지

# 자동 실행하지 않습니다. Actions 탭에서 직접 눌러 돌립니다.
# 남의 서버 수백 곳을 두드리는 작업이라 필요할 때만 돌리는 것이 맞습니다.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: '검사 범위'
        type: choice
        required: true
        default: '30개사 (시험용, 약 10분)'
        options:
          - '30개사 (시험용, 약 10분)'
          - '100개사 (약 30분)'
          - '전체 (약 305개사, 1시간 이상)'
          - 'PCB Maker 23개사 (약 10분)'
          - '모빌리티 스타트업 9개사 (약 5분)'
          - '로봇 30개사 (약 15분)'
          - '외국계 부품사 50개사 (약 25분)'
          - '반도체 218개사 (약 1시간)'
          - '전기전자 상장사 295개사 (약 1시간 30분)'
          - 'IT 서비스 상장사 231개사 (약 1시간 10분)'
          - '기계장비 상장사 149개사 (약 45분)'
          - 'IT 재탐지 (사이트맵 방식, 약 2시간)'
          - 'IT 재탐지 (브라우저 방식, 약 1시간)'
          - '금융 상장사 75개사 (약 20분)'
      new_only:
        description: '이미 등록된 기업은 건너뛰기'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 탐지 실행
        run: |
          # 입력칸을 비워도 깃허브가 기본값을 넣어버립니다.
          # 그래서 "비우면 전체" 방식은 쓸 수 없고, 목록에서 고르게 합니다.
          case "${{ inputs.scope }}" in
            30개사*)  ARGS="--limit 30" ;;
            100개사*) ARGS="--limit 100" ;;
            PCB*)     ARGS="--urls scripts/targets_pcb.txt" ;;
            모빌리티*) ARGS="--urls scripts/targets_startup.txt" ;;
            로봇*)     ARGS="--urls scripts/targets_robot.txt" ;;
            외국계*)   ARGS="--urls scripts/targets_foreign.txt" ;;
            반도체*)   ARGS="--urls scripts/targets_semi.txt" ;;
            전기전자*) ARGS="--urls scripts/targets_electronics.txt" ;;
            기계장비*) ARGS="--urls scripts/targets_machinery.txt" ;;
            금융*)     ARGS="--urls scripts/targets_finance.txt" ;;
            # "IT 재탐지" 가 "IT*" 보다 앞에 와야 합니다.
            # case 는 위에서부터 먼저 맞는 것을 고르므로, 순서가 바뀌면
            # 재탐지를 골라도 원래 IT 목록이 돌아갑니다.
            #
            # 브라우저 방식은 스크립트가 다릅니다. 자바스크립트로 그려지는
            # 메뉴까지 보므로 확실하지만 회사당 5~10초가 걸립니다.
            "IT 재탐지 (브라우저"*)
              ARGS="--urls scripts/targets_it_retry.txt"; USE_BROWSER=1 ;;
            "IT 재탐지"*) ARGS="--urls scripts/targets_it_retry.txt" ;;
            IT*)       ARGS="--urls scripts/targets_it.txt" ;;
            *)        ARGS="" ;;
          esac
          echo "범위: ${{ inputs.scope }}"
          if [ "$USE_BROWSER" = "1" ]; then
            # 브라우저 방식은 --new-only 를 쓰지 않습니다.
            # 이미 만들어둔 재탐지 목록에서 등록된 곳을 이미 뺐습니다.
            pip install --quiet playwright
            playwright install --with-deps chromium
            echo "실행: python scripts/probe_browser.py $ARGS"
            python scripts/probe_browser.py $ARGS
          else
            if [ "${{ inputs.new_only }}" = "true" ]; then ARGS="$ARGS --new-only"; fi
            echo "실행: python scripts/probe_ats1.py $ARGS"
            python scripts/probe_ats1.py $ARGS
          fi

      # 결과를 저장소에 남깁니다. Actions 로그는 시간이 지나면 지워지지만
      # 파일로 남겨두면 언제든 열어볼 수 있고, 지난 결과와 비교도 됩니다.
      - name: 결과 저장
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          # 한 줄에 여러 파일을 넣으면 하나라도 없을 때 전체가 실패합니다.
          # 브라우저 방식을 안 돌리면 probe_browser_result.csv 가 없어서
          # 사이트맵 결과까지 저장되지 않았습니다. 따로 처리합니다.
          for f in scripts/probe_result.csv scripts/probe_browser_result.csv; do
            [ -f "$f" ] && git add -f "$f"
          done
          git diff --staged --quiet || git commit -m "ATS 탐지 결과 $(date +%F)"
          git push || true

      # 로그가 지워져도 받아볼 수 있게 첨부파일로도 올립니다.
      - name: 결과 첨부
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: |
            scripts/probe_result.csv
            scripts/probe_browser_result.csv
          if-no-files-found: ignore
