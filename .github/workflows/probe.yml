name: ATS 탐지

# 자동 실행하지 않습니다. Actions 탭에서 직접 눌러 돌립니다.
# 남의 서버 수백 곳을 두드리는 작업이라 필요할 때만 돌리는 것이 맞습니다.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: '검사 범위'
        type: choice
        required: true
        default: '30개사 (시험용, 약 10분)'
        options:
          - '30개사 (시험용, 약 10분)'
          - '100개사 (약 30분)'
          - '전체 (약 305개사, 1시간 이상)'
          - 'PCB Maker 26개사 (약 10분)'
          - '모빌리티 스타트업 9개사 (약 5분)'
          - '로봇 30개사 (약 15분)'
          - '외국계 부품사 50개사 (약 25분)'
      new_only:
        description: '이미 등록된 기업은 건너뛰기'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 탐지 실행
        run: |
          # 입력칸을 비워도 깃허브가 기본값을 넣어버립니다.
          # 그래서 "비우면 전체" 방식은 쓸 수 없고, 목록에서 고르게 합니다.
          case "${{ inputs.scope }}" in
            30개사*)  ARGS="--limit 30" ;;
            100개사*) ARGS="--limit 100" ;;
            PCB*)     ARGS="--urls scripts/targets_pcb.txt" ;;
            모빌리티*) ARGS="--urls scripts/targets_startup.txt" ;;
            로봇*)     ARGS="--urls scripts/targets_robot.txt" ;;
            외국계*)   ARGS="--urls scripts/targets_foreign.txt" ;;
            *)        ARGS="" ;;
          esac
          if [ "${{ inputs.new_only }}" = "true" ]; then ARGS="$ARGS --new-only"; fi
          echo "범위: ${{ inputs.scope }}"
          echo "실행: python scripts/probe_ats1.py $ARGS"
          python scripts/probe_ats1.py $ARGS

      # 결과를 저장소에 남깁니다. Actions 로그는 시간이 지나면 지워지지만
      # 파일로 남겨두면 언제든 열어볼 수 있고, 지난 결과와 비교도 됩니다.
      - name: 결과 저장
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -f scripts/probe_result.csv || true
          git diff --staged --quiet || git commit -m "ATS 탐지 결과 $(date +%F)"
          git push || true

      # 로그가 지워져도 받아볼 수 있게 첨부파일로도 올립니다.
      - name: 결과 첨부
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: scripts/probe_result.csv
          if-no-files-found: ignore
