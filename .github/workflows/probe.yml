name: ATS 탐지

# 자동 실행하지 않습니다. Actions 탭에서 직접 눌러 돌립니다.
# 남의 서버 수백 곳을 두드리는 작업이라 필요할 때만 돌리는 것이 맞습니다.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '검사할 기업 수 (비우면 전체 약 305개사, 30분 이상 걸림)'
        required: false
        default: '30'
      new_only:
        description: '이미 등록된 기업은 건너뛰기'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 탐지 실행
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.new_only }}" = "true" ]; then ARGS="$ARGS --new-only"; fi
          echo "실행: python scripts/probe_ats.py $ARGS"
          python scripts/probe_ats1.py $ARGS

      # 결과를 저장소에 남깁니다. Actions 로그는 시간이 지나면 지워지지만
      # 파일로 남겨두면 언제든 열어볼 수 있고, 지난 결과와 비교도 됩니다.
      - name: 결과 저장
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -f scripts/probe_result.csv || true
          git diff --staged --quiet || git commit -m "ATS 탐지 결과 $(date +%F)"
          git push || true

      # 로그가 지워져도 받아볼 수 있게 첨부파일로도 올립니다.
      - name: 결과 첨부
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: scripts/probe_result.csv
          if-no-files-found: ignore
