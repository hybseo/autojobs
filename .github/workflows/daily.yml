name: 공고 갱신

# 하루 두 번 공고를 새로 받아 커밋합니다.
#
# 시간대는 UTC 입니다. 한국시간으로 보려면 9시간을 더하세요.
#   17 17 * * *  →  한국시간 02:17
#   17  5 * * *  →  한국시간 14:17

on:
  workflow_dispatch:
  schedule:
    - cron: '17 17 * * *'
    - cron: '17 5 * * *'

permissions:
  contents: write

# 두 실행이 겹치지 않게 합니다. 같은 파일을 동시에 커밋하면 충돌합니다.
concurrency:
  group: jobs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    # 수집에 걸리는 시간.
    #
    # 2026-09-30 에 60분을 넘겨 갱신이 중간에 취소됐습니다. 휴온스그룹까지만
    # 돌고 멈춰서 뒤쪽 회사들은 아예 수집되지 않았습니다.
    #
    # 등록 기업이 216곳으로 늘었고, 그리팅·나인하이어처럼 공고 하나하나의
    # 상세 페이지를 읽는 어댑터가 많아 요청 수가 큽니다. 토스 277건·
    # 넥슨 127건·무신사 117건이 들어온 것이 특히 컸습니다.
    #
    # 기업이 더 늘어 또 취소되면 이 숫자를 올리거나, 느린 어댑터의
    # 요청 시간(timeout)과 재시도 횟수를 줄이세요.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: python scripts/fetch_jobs.py | tee /tmp/fetch.log

      # 수집한 결과가 멀쩡한지 커밋하기 전에 봅니다.
      #
      # 여기서 막지 않으면 이상한 데이터가 그대로 배포됩니다. 2026-09-11 에
      # 같은 공고가 160번 중복된 채로 올라간 적이 있습니다. 며칠 뒤 숫자를
      # 비교하다 알았습니다.
      #
      # 실패가 있으면 커밋을 멈춥니다. 이전 데이터가 남아 있는 편이
      # 망가진 데이터가 올라가는 것보다 낫습니다.
      - name: 자가진단
        run: python scripts/check.py --log /tmp/fetch.log

      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/jobs.json
          git diff --cached --quiet || git commit -m "공고 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
