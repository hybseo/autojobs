name: 공고 갱신

# 하루 두 번 공고를 새로 받아 커밋합니다.
#
# 시간대는 UTC 입니다. 한국시간으로 보려면 9시간을 더하세요.
#   17 15 * * *  →  한국시간 00:17
#   17  0 * * *  →  한국시간 09:17
#
# 시각을 왜 이렇게 두었나 (2026-10-02)
# ------------------------------------
# 전에는 02:17 과 14:17 이었는데, 아침 7시가 되도록 갱신이 안 되는 날이
# 있었습니다. GitHub 의 예약 실행은 "그 시각쯤" 이지 정시가 아니고,
# 무료 계정은 몇 시간씩 밀리기도 합니다.
#
# 그래서 밤 갱신을 자정 직후로 당기고, 낮 갱신을 아침으로 옮겼습니다.
# 몇 시간 밀려도 출근 시간 전에는 끝납니다.
#
# 자정 "직후" 여야 합니다. 밤 11시대로 당기면 안 됩니다
# -----------------------------------------------------
# 사이트는 빌드 시점 날짜를 오늘로 삼아 마감을 판정합니다(lib.js TODAY).
# 밤 11시에 돌리면 그날 날짜로 빌드되어, 그날 마감인 공고가 다음 날
# 하루 내내 목록에 남습니다. 자정을 넘긴 00:17 이라야 날짜가 바뀐 뒤라
# 마감 판정이 맞습니다.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
    - cron: '17 0 * * *'

permissions:
  contents: write

# 두 실행이 겹치지 않게 합니다. 같은 파일을 동시에 커밋하면 충돌합니다.
concurrency:
  group: jobs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    # 수집에 걸리는 시간.
    #
    # 2026-09-30 에 60분을 넘겨 갱신이 중간에 취소됐습니다. 휴온스그룹까지만
    # 돌고 멈춰서 뒤쪽 회사들은 아예 수집되지 않았습니다.
    #
    # 등록 기업이 216곳으로 늘었고, 그리팅·나인하이어처럼 공고 하나하나의
    # 상세 페이지를 읽는 어댑터가 많아 요청 수가 큽니다. 토스 277건·
    # 넥슨 127건·무신사 117건이 들어온 것이 특히 컸습니다.
    #
    # 기업이 더 늘어 또 취소되면 이 숫자를 올리거나, 느린 어댑터의
    # 요청 시간(timeout)과 재시도 횟수를 줄이세요.
    #
    # 2026-10-06 에 90분 → 180분으로 올렸습니다.
    #
    # 그리팅을 쓰는 기업을 전수 조사해 162곳을 새로 등록했습니다.
    # 활성 기업 231곳 → 393곳, 공고 약 3,200건 → 약 4,800건입니다.
    #
    # 그리팅 어댑터는 공고 하나하나의 상세 페이지를 따로 읽고 그때마다
    # 0.3초를 쉽니다. 신규 1,625건이면 요청과 대기를 합쳐 27분 안팎이
    # 더 걸립니다. 90분으로 두면 또 취소될 수 있어 넉넉히 180분으로
    # 잡았습니다. 실제 소요 시간은 Actions 화면의 실행 기록에서
    # 확인하고, 여유가 크면 다시 줄이세요.
    timeout-minutes: 180

    steps:
      # ref: main 을 반드시 적어야 합니다 (2026-10-07)
      # ----------------------------------------------
      # 예약 실행은 "예약된 시각의 커밋"을 받아옵니다. 그런데 위의
      # concurrency 때문에 앞 실행이 끝날 때까지 기다리는 일이 있고,
      # 실제로 한 시간 넘게 기다린 적이 있습니다.
      #
      # 기다리는 동안 저장소가 앞서가면(파일을 올리거나 수동 갱신이
      # 커밋하면) 낡은 커밋에서 출발하게 되고, 마지막 push 가 거부됩니다.
      # ref: main 을 적으면 기다림이 끝난 뒤의 최신 상태를 받습니다.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: python scripts/fetch_jobs.py | tee /tmp/fetch.log

      # 수집한 결과가 멀쩡한지 커밋하기 전에 봅니다.
      #
      # 여기서 막지 않으면 이상한 데이터가 그대로 배포됩니다. 2026-09-11 에
      # 같은 공고가 160번 중복된 채로 올라간 적이 있습니다. 며칠 뒤 숫자를
      # 비교하다 알았습니다.
      #
      # 실패가 있으면 커밋을 멈춥니다. 이전 데이터가 남아 있는 편이
      # 망가진 데이터가 올라가는 것보다 낫습니다.
      - name: 자가진단
        run: python scripts/check.py --log /tmp/fetch.log

      # push 가 거부되면 다시 얹어서 재시도합니다 (2026-10-07)
      # ------------------------------------------------------
      # 2026-10-07 에 예약 실행 두 번(#181, #188)이 이 단계에서 실패했습니다.
      # 수집도 자가진단도 전부 통과했는데, 마지막 push 가 이렇게 거부됐습니다.
      #
      #   ! [rejected] main -> main (fetch first)
      #
      # 수집에 한 시간 반이 걸리는 동안 저장소가 앞서가면 생깁니다. 그날은
      # 파일을 올리고 수동 갱신을 돌리던 중이었습니다. 한 시간 반 수집한
      # 결과를 마지막 한 줄에서 통째로 버렸습니다.
      #
      # 위의 ref: main 으로 출발점은 맞췄지만, 수집하는 한 시간 반 사이에
      # 또 올라올 수 있습니다. 그래서 거부되면 다시 얹어 재시도합니다.
      #
      # 어느 쪽을 살리는가
      #   jobs.json          이 실행이 방금 만든 것이 항상 최신입니다. 우리 것으로 덮습니다.
      #   그 밖의 모든 파일   저장소 쪽이 최신입니다. 그대로 받아들입니다.
      #
      # git pull --rebase 를 쓰지 않는 이유는, jobs.json 은 매번 통째로
      # 다시 쓰는 파일이라 줄 단위로 합치면 깨지기 때문입니다. 충돌이
      # 생길 수 없는 방식으로 갑니다.
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MSG="공고 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"

          git add src/data/jobs.json
          git diff --cached --quiet || git commit -m "$MSG"

          for i in 1 2 3; do
            if git push; then
              echo "저장했습니다."
              exit 0
            fi
            echo "push 가 거부됐습니다 ($i/3). 저장소 최신 상태에 다시 얹습니다."
            sleep 5
            cp src/data/jobs.json /tmp/jobs-new.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/jobs-new.json src/data/jobs.json
            git add src/data/jobs.json
            if git diff --cached --quiet; then
              echo "저장소에 있는 것과 같습니다. 더 할 일이 없습니다."
              exit 0
            fi
            git commit -m "$MSG"
          done

          echo "세 번 모두 거부됐습니다. 수집 결과를 저장하지 못했습니다."
          exit 1
