name: 공고 갱신

on:
  # 하루 두 번 돕니다. KST 06:00 과 18:00 (UTC 21:00, 09:00).
  #
  # 한 번만 돌리면 그 한 번이 걸러졌을 때 하루치가 통째로 밀립니다.
  # 깃허브는 부하가 몰리면 예약 실행을 지연시키거나 건너뜁니다. 보장되지 않습니다.
  # 실제로 2026-08-28 새벽 실행이 통째로 건너뛰어져, 마감된 공고 40건이
  # 하루 종일 "오늘 마감" 으로 남아 있었습니다.
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 두 실행이 겹치지 않게 합니다. 같은 파일을 동시에 커밋하면 충돌합니다.
concurrency:
  group: jobs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: python scripts/fetch_jobs.py

      - name: commit
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add src/data/jobs.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "공고 갱신 $(date +%F)"

          # 수집하는 동안 누가 파일을 올렸으면 push 가 거부됩니다.
          # 그냥 실패시키면 수집한 결과가 통째로 날아갑니다. 실제로 그런 적이 있습니다.
          # 원격 변경을 먼저 받아 합친 뒤 다시 시도합니다. jobs.json 은
          # 이 워크플로만 건드리므로 내용 충돌은 나지 않습니다.
          for i in 1 2 3; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 거부됨. 원격 변경을 받아 다시 시도합니다 ($i/3)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "3회 시도 후에도 push 실패"
          exit 1
