name: 공고 갱신

on:
  # 하루 두 번 돕니다. KST 02:17 과 14:17 (UTC 17:17, 05:17).
  #
  # 두 가지를 노린 시각입니다.
  #
  # 1) 새벽 2시대
  #    깃허브 예약은 정확하지 않습니다. 부하가 몰리면 몇 시간씩 밀리거나
  #    아예 건너뜁니다. 실제로 06:00 설정이 05:32·14:08·22:07 처럼 제각각
  #    실행됐고, 2026-09-03 아침에는 06:00 예약이 07:30 까지도 돌지
  #    않았습니다. 06:00 에 두면 조금만 밀려도 아침에 어제 데이터를
  #    보게 됩니다. 새벽 2시면 네 시간이 밀려도 아침 6시 전에 끝납니다.
  #
  # 2) 정각이 아닌 17분
  #    전 세계 저장소가 정각(0분)에 예약을 걸어 그 시각 대기열이 가장
  #    깁니다. 어중간한 분으로 두면 덜 붐빕니다.
  #
  # 실행 횟수를 늘리는 대신 시각을 옮긴 이유는, 횟수를 늘리면 상대
  # 서버에 요청이 그만큼 늘기 때문입니다. 남의 서버입니다.
  #
  # 그래도 자주 걸러지면 외부에서 깨우는 방법(Cloudflare Cron 등)을
  # 검토하세요. 깃허브 예약은 실행을 보장하지 않습니다.
  schedule:
    - cron: '17 17 * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 두 실행이 겹치지 않게 합니다. 같은 파일을 동시에 커밋하면 충돌합니다.
concurrency:
  group: jobs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: python scripts/fetch_jobs.py

      - name: commit
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add src/data/jobs.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          # Actions 서버는 UTC 입니다. 커밋 메시지도 한국 날짜로 적어야
          # 나중에 이력을 볼 때 데이터의 collectedAt 과 어긋나지 않습니다.
          git commit -m "공고 갱신 $(TZ=Asia/Seoul date +%F)"

          # 수집하는 동안 누가 파일을 올렸으면 push 가 거부됩니다.
          # 그냥 실패시키면 수집한 결과가 통째로 날아갑니다. 실제로 그런 적이 있습니다.
          # 원격 변경을 먼저 받아 합친 뒤 다시 시도합니다. jobs.json 은
          # 이 워크플로만 건드리므로 내용 충돌은 나지 않습니다.
          for i in 1 2 3; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 거부됨. 원격 변경을 받아 다시 시도합니다 ($i/3)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "3회 시도 후에도 push 실패"
          exit 1
